<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상식 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <p class="student">학번 2601947 이름 송민서</p>
    <h1 class="app-title">상식 퀴즈</h1>

    <section id="screen-category" class="screen">
      <p class="notice">카테고리를 고르세요</p>
      <div id="category-list" class="button-list"></div>
    </section>

    <section id="screen-mode" class="screen" hidden>
      <h2 id="mode-title"></h2>
      <div id="mode-list" class="button-list"></div>
      <div class="quiz-actions">
        <button id="btn-mode-back" type="button" class="secondary">뒤로</button>
      </div>
    </section>

    <section id="screen-quiz" class="screen" hidden>
      <div class="quiz-header">
        <span id="quiz-meta"></span>
        <span id="quiz-progress"></span>
        <span id="quiz-score"></span>
      </div>
      <p id="quiz-question" class="question"></p>
      <div id="quiz-choices" class="button-list"></div>
      <div id="quiz-feedback" class="feedback" hidden>
        <p id="feedback-verdict" class="verdict"></p>
        <p id="feedback-explanation"></p>
        <p id="feedback-source" class="source"></p>
      </div>
      <div class="quiz-actions">
        <button id="btn-next" type="button" class="primary" hidden>다음</button>
        <button id="btn-quit" type="button" class="secondary">그만두기</button>
      </div>
    </section>

    <section id="screen-result" class="screen" hidden>
      <h2 id="result-title"></h2>
      <p id="result-score" class="result-score"></p>
      <p id="result-count"></p>
      <p id="result-note" class="notice"></p>
      <div class="button-list">
        <button id="btn-again" type="button" class="primary">같은 카테고리 다시</button>
        <button id="btn-home" type="button" class="secondary">처음으로</button>
      </div>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
